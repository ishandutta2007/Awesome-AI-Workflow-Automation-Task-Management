<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="badgeGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".2"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".5" stroke-width=".8" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity=".3"/></pattern><style>@keyframes pulse{0%{transform:scale(.98);opacity:.7}}@keyframes floatOrb{0%{transform:translate(0,0)}50%{transform:translate(25px,-20px)}}.node-pulse{animation:pulse 3s ease-in-out infinite alternate}.node-pulse-2{animation:pulse 4s ease-in-out infinite alternate}.flow-line{stroke-dasharray:8 6;animation:dash 20s linear infinite}.orb{animation:floatOrb 8s ease-in-out infinite alternate}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.subtitle-text{font-weight:500;letter-spacing:.2px}.tag-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-weight:600;font-size:13px}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#grid)"/><g class="orb" opacity=".35"><circle cx="150" cy="80" r="140" fill="#38bdf8" filter="url(#glow)"/><circle cx="1080" cy="320" r="160" fill="#a855f7" filter="url(#glow)"/><circle cx="920" cy="90" r="100" fill="#3b82f6" filter="url(#glow)"/></g><g fill="none" stroke-width="2" class="flow-line"><path stroke="#38bdf8" stroke-opacity=".4" d="M 120 340 C 300 370, 500 350, 700 360 C 900 370, 1000 310, 1100 330"/><path stroke="#818cf8" stroke-opacity=".35" d="M 80 120 C 280 90, 480 140, 680 110 C 880 80, 1020 150, 1120 130"/></g><g class="node-pulse" transform-origin="1050 180"><rect width="140" height="60" x="980" y="150" fill="#1e293b" fill-opacity=".8" stroke="#38bdf8" stroke-width="1.5" rx="12"/><circle cx="1005" cy="180" r="8" fill="#38bdf8"/><text x="1025" y="185" fill="#f8fafc" class="tag-text">AI AGENT</text></g><g class="node-pulse-2" transform-origin="80 260"><rect width="130" height="56" x="50" y="230" fill="#1e293b" fill-opacity=".8" stroke="#a855f7" stroke-width="1.5" rx="12"/><circle cx="75" cy="258" r="8" fill="#a855f7"/><text x="95" y="263" fill="#f8fafc" class="tag-text">PIPELINE</text></g><g text-anchor="middle" transform="translate(600, 195)"><rect width="360" height="36" x="-180" y="-140" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1" rx="18"/><text x="0" y="-117" fill="#38bdf8" class="tag-text" letter-spacing="1.5">⚡ CURATED ECOSYSTEM DIRECTORY ⚡</text><text x="0" y="-45" fill="url(#textGrad)" class="title-text" filter="url(#glow)" font-size="44">Awesome AI Workflow Automation</text><text x="0" y="8" fill="#f8fafc" class="title-text" font-size="34">&amp; Task Management</text><text x="0" y="60" fill="#94a3b8" class="subtitle-text" font-size="18">Enterprise Orchestration • Autonomous Agents • Visual Low-Code • Self-Hosted Engines</text><g transform="translate(0, 105)"><rect width="165" height="32" x="-370" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><text x="-287" y="20" fill="#cbd5e1" class="subtitle-text" font-size="13">🤖 Agentic Workflows</text><rect width="165" height="32" x="-185" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><text x="-102" y="20" fill="#cbd5e1" class="subtitle-text" font-size="13">🌐 SaaS &amp; iPaaS Tiers</text><rect width="175" height="32" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><text x="87" y="20" fill="#cbd5e1" class="subtitle-text" font-size="13">🔓 Open-Source Stars</text><rect width="175" height="32" x="195" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><text x="282" y="20" fill="#cbd5e1" class="subtitle-text" font-size="13">🔌 MCP &amp; Orchestration</text></g></g></svg>