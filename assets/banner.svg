<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <style>
      .node-pulse {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .node-pulse-2 {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dash 20s linear infinite;
      }
      .orb {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes pulse {
        0% { transform: scale(0.98); opacity: 0.7; }
        100% { transform: scale(1.02); opacity: 1; }
      }
      @keyframes floatOrb {
        0% { transform: translate(0px, 0px); }
        50% { transform: translate(25px, -20px); }
        100% { transform: translate(-20px, 15px); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Dynamic Glowing Background Orbs -->
  <g class="orb" opacity="0.35">
    <circle cx="150" cy="80" r="140" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="1080" cy="320" r="160" fill="#a855f7" filter="url(#glow)"/>
    <circle cx="920" cy="90" r="100" fill="#3b82f6" filter="url(#glow)"/>
  </g>

  <!-- Dynamic Flow Connector Lines (Background) -->
  <g class="flow-line" fill="none" stroke-width="2">
    <path d="M 120 340 C 300 370, 500 350, 700 360 C 900 370, 1000 310, 1100 330" stroke="#38bdf8" stroke-opacity="0.4"/>
    <path d="M 80 120 C 280 90, 480 140, 680 110 C 880 80, 1020 150, 1120 130" stroke="#818cf8" stroke-opacity="0.35"/>
  </g>

  <!-- Decorative Animated Orbiting Nodes / Workflow Points -->
  <g class="node-pulse" transform-origin="1050 180">
    <rect x="980" y="150" width="140" height="60" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="1005" cy="180" r="8" fill="#38bdf8"/>
    <text x="1025" y="185" fill="#f8fafc" class="tag-text">AI AGENT</text>
  </g>

  <g class="node-pulse-2" transform-origin="80 260">
    <rect x="50" y="230" width="130" height="56" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="75" cy="258" r="8" fill="#a855f7"/>
    <text x="95" y="263" fill="#f8fafc" class="tag-text">PIPELINE</text>
  </g>

  <!-- Foreground Content Block (Guaranteed clean view) -->
  <g transform="translate(600, 195)" text-anchor="middle">
    <!-- Super Title / Category Badge -->
    <rect x="-180" y="-140" width="360" height="36" rx="18" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="0" y="-117" fill="#38bdf8" class="tag-text" letter-spacing="1.5">⚡ CURATED ECOSYSTEM DIRECTORY ⚡</text>

    <!-- Main Title -->
    <text x="0" y="-45" fill="url(#textGrad)" class="title-text" font-size="44" filter="url(#glow)">Awesome AI Workflow Automation</text>
    <text x="0" y="8" fill="#f8fafc" class="title-text" font-size="34">&amp; Task Management</text>

    <!-- Subtitle & Tagline -->
    <text x="0" y="60" fill="#94a3b8" class="subtitle-text" font-size="18">Enterprise Orchestration • Autonomous Agents • Visual Low-Code • Self-Hosted Engines</text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 105)">
      <!-- Badge 1 -->
      <rect x="-370" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="-287" y="20" fill="#cbd5e1" class="subtitle-text" font-size="13">🤖 Agentic Workflows</text>

      <!-- Badge 2 -->
      <rect x="-185" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="-102" y="20" fill="#cbd5e1" class="subtitle-text" font-size="13">🌐 SaaS &amp; iPaaS Tiers</text>

      <!-- Badge 3 -->
      <rect x="0" y="0" width="175" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="87" y="20" fill="#cbd5e1" class="subtitle-text" font-size="13">🔓 Open-Source Stars</text>

      <!-- Badge 4 -->
      <rect x="195" y="0" width="175" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="282" y="20" fill="#cbd5e1" class="subtitle-text" font-size="13">🔌 MCP &amp; Orchestration</text>
    </g>
  </g>
</svg>
